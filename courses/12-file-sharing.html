<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Defence Lab · File Sharing: Links, Folders and Old Access</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --mood{syntax:'<number>';inherits:true;initial-value:0}
:root{
  --ac:#34B77D;--acd:#2A9A66;--ac-soft:rgba(52,183,125,.12);
  --gr:#2EAD6B;--gl:rgba(46,173,107,.14);--rd:#E0574F;--rl:rgba(224,87,79,.12);
  --tw:#EDEFEC;--tm:rgba(237,239,236,.66);--tf:rgba(237,239,236,.36);
  --paper:#FCFCFB;--ink:#1A1A1A;--ink-m:#55605A;--ink-f:#8A938E;--line:#E4E7E3;
  --blue:#4E7CA8;
  --disp:'Fraunces',Georgia,serif;--body:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:var(--body);background:#18231d;color:var(--tw);-webkit-font-smoothing:antialiased}
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
/* top chrome */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;flex:none;z-index:30}
.brand{font-family:var(--disp);font-size:18px;font-weight:600}.brand span{color:var(--ac)}
.chip{font:700 12px var(--mono);color:var(--ac);background:var(--ac-soft);border-radius:20px;padding:6px 13px}
.top-right{display:flex;gap:10px;align-items:center}
.fs-btn{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--tm);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fs-btn svg{width:15px;height:15px}
/* body: rail (fixed) + scroll area */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}
.rail{padding:0 30px 0 40px;display:flex;flex-direction:column;justify-content:center;
  background:radial-gradient(120% 70% at -10% 22%,rgba(52,183,125,.22),transparent 60%),radial-gradient(90% 60% at 0% 100%,rgba(78,124,168,.14),transparent 62%),#1a2620}
.rail .eyebrow{font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:14px}
.rail h1{font-family:var(--disp);font-weight:600;font-size:clamp(26px,2.4vw,36px);line-height:1.08;letter-spacing:-.02em;margin-bottom:16px}
.rail .r-sub{font-size:14px;line-height:1.55;color:var(--tm);margin-bottom:26px}
.rail .sh{width:46px;height:auto;margin-bottom:12px}
/* scroll area */
.scroll{position:relative;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;--mood:0;
  background:
    radial-gradient(80% 55% at 12% 4%,rgba(52,183,125,calc(0.30 - var(--mood)*0.14)),transparent 52%),
    radial-gradient(90% 70% at 88% calc(70% + var(--mood)*30%),rgba(78,124,168,calc(0.16 + var(--mood)*0.24)),transparent 58%),
    radial-gradient(60% 45% at 60% 32%,rgba(255,255,255,calc(0.10 - var(--mood)*0.05)),transparent 60%),
    linear-gradient(165deg,#1c2a22,#1a2430 calc(55% + var(--mood)*10%),#182430);
  transition:--mood .25s linear}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.track{position:relative;max-width:1340px;margin:0;padding:10vh 3vw 40vh 3vw}
/* the vertical spine */
.spine{position:absolute;left:calc(3vw + 10px);top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.14) 6%,rgba(255,255,255,.14) 94%,transparent)}
.spine-fill{position:absolute;left:calc(3vw + 10px);top:0;width:2px;background:var(--ac);height:0;transition:height .3s ease;box-shadow:0 0 10px rgba(52,183,125,.5)}
/* nodes on the spine */
.node{position:relative;padding-left:calc(3vw + 46px);margin-bottom:64px;opacity:.5;transform:translateY(0);transition:opacity .5s}
.node.seen{opacity:1}
.node .dot{position:absolute;left:3vw;top:2px;width:20px;height:20px;border-radius:50%;background:#2a332e;border:2px solid rgba(255,255,255,.25);transition:all .35s;z-index:2}
.node.seen .dot{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 5px rgba(52,183,125,.15)}
.node.crit.seen .dot{background:var(--rd);border-color:var(--rd);box-shadow:0 0 0 5px rgba(224,87,79,.15)}
.node .date{font:700 11px var(--mono);letter-spacing:.06em;color:var(--ac);text-transform:uppercase;margin-bottom:6px}
.node.crit .date{color:var(--rd)}
.node .beat{font-family:var(--disp);font-size:clamp(19px,1.7vw,24px);font-weight:600;color:var(--tw);line-height:1.3;margin-bottom:8px}
.node .body{font-size:16.5px;line-height:1.72;color:var(--tm);max-width:980px}
/* SPOT — interactive point that opens a question */
.spot{margin-top:18px;max-width:980px}
.spot-trigger{display:inline-flex;align-items:center;gap:10px;background:rgba(52,183,125,.1);border:1px solid rgba(52,183,125,.4);color:var(--ac);
  font:600 14px var(--body);padding:11px 18px;border-radius:12px;cursor:pointer;transition:all .18s}
.spot-trigger:hover{background:rgba(52,183,125,.18);transform:translateY(-1px)}
.spot-trigger .pulse{width:9px;height:9px;border-radius:50%;background:var(--ac);animation:sppulse 1.8s ease-in-out infinite}
@keyframes sppulse{0%,100%{opacity:.5;box-shadow:0 0 0 0 rgba(52,183,125,.5)}50%{opacity:1;box-shadow:0 0 0 6px rgba(52,183,125,0)}}
.spot-trigger.q-exp{background:rgba(78,124,168,.1);border-color:rgba(78,124,168,.5);color:#7ba7d4}
.spot-trigger.q-exp .pulse{background:#7ba7d4;box-shadow:none;animation:none}
.spot-card{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:0 16px 40px rgba(0,0,0,.28);
  max-height:0;opacity:0;overflow:hidden;transition:max-height .45s ease,opacity .35s ease,padding .3s;padding-top:0;padding-bottom:0}
.spot-card.open{max-height:900px;opacity:1;padding-top:24px;padding-bottom:26px}
.spot-q{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:16px}
.spot-opts{display:flex;flex-direction:column;gap:10px}
.spot-opt{background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 16px;font-size:15px;color:var(--ink);cursor:pointer;text-align:left;font-family:var(--body);transition:all .16s}
.spot-opt:hover{border-color:var(--acd)}
.spot-opt.correct{border-color:var(--gr);background:var(--gl)}
.spot-opt.wrong{border-color:var(--rd);background:var(--rl)}
.spot-opt.picked{border-color:var(--acd);background:rgba(52,183,125,.08)}
.spot-conf{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.spot-conf.show{display:block;animation:rise .35s}
.spot-conf-q{font-size:14px;color:var(--ink-m);margin-bottom:9px}
.spot-conf-row{display:flex;gap:8px;flex-wrap:wrap}
.conf-b{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 14px;font:600 14px var(--body);color:var(--ink);cursor:pointer;transition:all .16s}
.conf-b:hover{border-color:var(--acd)}
.spot-fb{margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--ink-m);border-top:1px solid var(--line);padding-top:14px;display:none}
.spot-fb.show{display:block;animation:rise .4s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spot-fb .xpb{display:inline-block;font:700 11px var(--mono);color:var(--acd);background:rgba(46,173,107,.12);border-radius:20px;padding:3px 10px;margin-bottom:8px}
.spot-fb b.v-ok{color:var(--gr)}.spot-fb b.v-no{color:var(--rd)}
/* experience (reflection) spot */
.spot-card.exp{border-color:rgba(78,124,168,.35);background:linear-gradient(180deg,#fbfcfd,#f6f9fc)}
.exp-scale{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.exp-btn{flex:1;min-width:90px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px;font:600 13px var(--body);color:var(--ink-m);cursor:pointer;transition:all .15s}
.exp-btn:hover{border-color:var(--blue)}.exp-btn.sel{border-color:var(--blue);background:rgba(78,124,168,.08);color:var(--blue)}
.exp-note{margin-top:14px;font-size:14.5px;line-height:1.6;color:var(--ink-m);display:none}.exp-note.show{display:block;animation:rise .4s}
/* scroll hint */
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font:600 12px var(--body);color:var(--tf);display:flex;flex-direction:column;align-items:center;gap:4px;animation:bob 2s ease-in-out infinite;pointer-events:none;z-index:5}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(5px)}}
.scroll-hint.hide{opacity:0;transition:opacity .4s}
/* end card */
/* takeaways */
/* risk slider */
.slider-spot{max-width:760px}
.rslider{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 14px 36px rgba(0,0,0,.26)}
.rslider-q{font-family:var(--disp);font-size:18px;font-weight:600;color:var(--ink);margin-bottom:18px;line-height:1.35}
.rslider-row{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.rslider-label{width:60px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-f);flex:none}
.rslider-input{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--line);outline:none;cursor:pointer}
.rslider-input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acd);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;transition:transform .1s}
.rslider-input::-webkit-slider-thumb:hover{transform:scale(1.12)}
.rslider-input::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acd);border:3px solid #fff;cursor:pointer}
.rslider-val{width:34px;font:700 16px var(--mono);color:var(--ink);text-align:center;flex:none}
.rslider-result{display:flex;flex-direction:column;gap:8px;padding:18px 20px;border-radius:12px;border:2px solid var(--line);transition:all .3s}
.rslider-result.lvl-crit{border-color:var(--rd);background:var(--rl)}
.rslider-result.lvl-high{border-color:#c8781e;background:rgba(200,120,30,.08)}
.rslider-result.lvl-med{border-color:#c8a13e;background:rgba(200,161,62,.1)}
.rslider-result.lvl-low{border-color:var(--gr);background:var(--gl)}
.rslider-score{font:700 26px var(--mono);transition:color .3s}
.lvl-crit .rslider-score{color:var(--rd)}.lvl-high .rslider-score{color:#b8690f}.lvl-med .rslider-score{color:#a8862e}.lvl-low .rslider-score{color:var(--gr)}
.rslider-info{flex:1}
.rslider-level{font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px;transition:color .3s}
.lvl-crit .rslider-level{color:var(--rd)}.lvl-high .rslider-level{color:#b8690f}.lvl-med .rslider-level{color:#a8862e}.lvl-low .rslider-level{color:var(--gr)}
.rslider-explain{font-size:13px;color:var(--ink-m);line-height:1.5}
.rslider-bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--rd) 0%,#c8781e 30%,#c8a13e 55%,var(--gr) 100%);margin-top:16px;position:relative}
.rslider-marker{position:absolute;top:-5px;width:4px;height:16px;background:#fff;border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:left .15s;left:16%}
.rslider-eg{margin-top:14px;font-size:13.5px;color:var(--ink-m);line-height:1.5}
.rslider-eg b{color:var(--ink)}
.rslider-src{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--ink-f)}
.rslider-src a{color:var(--acd);text-decoration:none;border-bottom:1px solid rgba(46,173,107,.4)}
.rslider-src a:hover{border-color:var(--acd)}

.takeaways{max-width:880px}
.tk-list{display:flex;flex-direction:column;gap:14px}
.tk{display:flex;gap:16px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:0 6px 18px rgba(0,0,0,.14)}
.tk-ic{font-size:26px;flex:none;line-height:1}
.tk-t{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--ink);margin-bottom:5px}
.tk-b{font-size:15.5px;line-height:1.6;color:var(--ink-m)}
/* your plan (in end card) */
.yourplan{margin:4px 0 18px;text-align:left}
.yp-title{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:8px}
.yp-sub{font-size:14px;color:var(--tm);margin-bottom:10px}
.yp-list{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px}
.yp-list li{font-size:15px;color:var(--tw);padding-left:26px;position:relative;line-height:1.45}
.yp-list li::before{content:"\2713";position:absolute;left:0;top:0;color:var(--ac);font-weight:700}

/* Scene 2 checklist + personal feedback */
.node.s2 .date{color:var(--blue)}
.node.s2 .dot{border-color:var(--blue)}.node.s2.seen .dot{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 5px rgba(78,124,168,.15)}
.checklist-spot{max-width:820px}
.personal{background:linear-gradient(180deg,rgba(78,124,168,.14),rgba(78,124,168,.05));border:1px solid rgba(78,124,168,.35);border-radius:16px;padding:20px 24px;margin-bottom:18px}
.personal .p-title{font:700 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8fb4d6;margin-bottom:10px}
.personal .p-line{font-size:16px;line-height:1.6;color:var(--tw);margin-bottom:8px}
.personal .p-weak{margin:6px 0 4px;padding-left:20px}
.personal .p-weak li{font-size:15.5px;line-height:1.6;color:var(--tw);font-weight:600}
.personal .p-strong{font-size:14px;color:var(--tm);margin-top:8px}
.checklist{display:flex;flex-direction:column;gap:11px}
.cl-item{background:var(--paper);border:1.5px solid var(--line);border-radius:13px;padding:6px 18px 6px;transition:all .16s;position:relative;overflow:hidden}
.cl-row{display:flex;align-items:center;gap:14px;padding:10px 0;cursor:default}
.cl-box{width:24px;height:24px;border-radius:7px;border:2px solid #cdd3ce;flex:none;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:14px;color:transparent;cursor:pointer}
.cl-item.on .cl-box{background:var(--acd);border-color:var(--acd);color:#fff}
.cl-item.on{border-color:var(--acd);background:var(--gl)}
.cl-t{font-size:16px;color:var(--ink);flex:1}
.cl-flag{display:none;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:20px;padding:4px 10px;flex:none}
.cl-item.focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(78,124,168,.12)}
.cl-item.focus .cl-flag{display:block}
.cl-item.focus.on .cl-flag{background:var(--acd)}
.cl-toggle{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink-m);font:600 12px var(--body);padding:6px 12px;cursor:pointer;flex:none;transition:all .15s}
.cl-toggle:hover{border-color:var(--acd);color:var(--acd)}
.cl-how{max-height:0;opacity:0;overflow:hidden;transition:max-height .4s ease,opacity .3s ease}
.cl-how.open{max-height:400px;opacity:1;padding:4px 0 14px}
.cl-how .chow{font-size:14.5px;line-height:1.55;color:var(--ink-m);margin-bottom:10px}
.cl-how .csteps{margin:0 0 12px;padding-left:20px}
.cl-how .csteps li{font-size:14.5px;line-height:1.6;color:var(--ink);margin-bottom:4px}
.cl-how .clinks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cl-how .clinks a{font:600 13px var(--body);color:var(--acd);text-decoration:none;background:var(--gl);border:1px solid rgba(46,173,107,.3);border-radius:9px;padding:8px 12px;transition:all .15s}
.cl-how .clinks a:hover{background:var(--acd);color:#fff}
.cl-itnote{font-size:13px;line-height:1.5;color:var(--ink-f);background:rgba(78,124,168,.08);border-radius:9px;padding:9px 12px;margin-bottom:12px}
.cl-done{background:var(--acd);color:#fff;border:none;border-radius:9px;font:600 13px var(--body);padding:9px 16px;cursor:pointer}
.cl-done:hover{background:var(--gr)}
.cl-gate{margin-top:14px;font:600 13px var(--body);color:var(--tf);display:flex;align-items:center;gap:8px}
.cl-gate.done{color:var(--ac)}

/* gating: locked nodes are a blurred teaser, unreadable + non-interactive until unlocked */

/* glossary hover terms */
.gloss{border-bottom:1.5px dotted var(--ac);cursor:help;color:inherit;transition:color .15s}
.gloss:hover{color:var(--ac)}
#gloss-tip{position:fixed;z-index:200;max-width:320px;background:#0f1613;color:#EDEFEC;border:1px solid rgba(52,183,125,.4);
  border-radius:11px;padding:12px 15px;font:400 13.5px/1.55 var(--body);box-shadow:0 12px 34px rgba(0,0,0,.5);
  opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .18s,transform .18s}
#gloss-tip.on{opacity:1;transform:translateY(0)}
#gloss-tip b{color:var(--ac)}

.node{transition:opacity .55s ease,filter .55s ease,transform .55s ease}
.node.locked{filter:blur(7px);opacity:.4;pointer-events:none;user-select:none}
.node.locked .spot-trigger{opacity:.5}
.node.unlocking{filter:blur(0);opacity:1}
.lock-hint{display:inline-flex;align-items:center;gap:8px;margin-top:2px;font:600 13px var(--body);color:var(--tf)}
.lock-hint svg{width:14px;height:14px}
/* end card also gated */
.endcard.locked{filter:blur(7px);opacity:.4;pointer-events:none}

.endcard{padding-left:calc(3vw + 46px);margin-top:20px}
.endcard .ec{background:linear-gradient(170deg,rgba(52,183,125,.12),rgba(52,183,125,.04));border:1px solid rgba(52,183,125,.3);border-radius:16px;padding:24px 28px;max-width:820px}
.endcard .ec h3{font-family:var(--disp);font-size:22px;font-weight:600;margin-bottom:10px}
.endcard .ec p{font-size:15px;line-height:1.6;color:var(--tm);margin-bottom:16px}

/* ── email mock: shared ── */
.mail{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:border-color .2s,box-shadow .2s}
.mail-hd{padding:13px 17px;border-bottom:1px solid var(--line);background:#F5F7F4}
.mail-row{display:flex;gap:8px;font-size:13px;line-height:1.5;color:var(--ink-m);margin-bottom:3px}
.mail-row .ml{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-f);width:52px;flex:none;padding-top:2px}
.mail-subj{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.4}
.mail-bd{padding:15px 17px;font-size:14px;line-height:1.65;color:var(--ink-m)}
.mail-bd p{margin-bottom:9px}
.mail-link{font:500 13px var(--mono);color:#3f6ea3;word-break:break-all;margin-bottom:11px}
.mail-btn{display:inline-block;background:#e8ece7;color:var(--ink-m);border-radius:8px;padding:8px 15px;font:600 13px var(--body)}
.mail-foot{padding:10px 17px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-f)}

/* ── cold open: two emails side by side ── */
.compare-spot{max-width:1060px}
.cmp-q{font-family:var(--disp);font-size:19px;font-weight:600;color:var(--tw);margin-bottom:14px}
.mailgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.mailgrid{grid-template-columns:1fr}}
.mailwrap{display:flex;flex-direction:column}
.mailwrap .mail{flex:1;display:flex;flex-direction:column}
.mailwrap .mail-bd{flex:1}
.mail-pick{margin-top:10px;background:rgba(52,183,125,.1);border:1px solid rgba(52,183,125,.45);color:var(--ac);font:600 14px var(--body);padding:11px;border-radius:11px;cursor:pointer;transition:all .16s}
.mail-pick:hover{background:rgba(52,183,125,.2)}
.mailwrap.picked .mail-pick{opacity:.35;pointer-events:none}
.mail-verdict{display:none;margin-top:10px;font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px;border-radius:9px;text-align:center}
.mailwrap.revealed .mail-pick{display:none}
.mailwrap.revealed .mail-verdict{display:block}
.mailwrap.is-fake .mail{border-color:var(--rd);box-shadow:0 0 0 3px rgba(224,87,79,.16),0 10px 28px rgba(0,0,0,.22)}

<body>
<div class="app">
  <div class="top"><div class="brand">Defence<span>Lab</span></div>
    <div class="top-right"><div class="chip" id="xp">0 XP</div>
      <button class="fs-btn" onclick="fsT()"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><polyline points="1,5 1,1 5,1"/><polyline points="9,1 13,1 13,5"/><polyline points="13,9 13,13 9,13"/><polyline points="5,13 1,13 1,9"/></svg></button>
    </div>
  </div>
  <div class="stage">
    <div class="rail">
      <svg class="sh" viewBox="0 0 120 124"><path d="M60 6 L106 24 L106 66 Q106 104 60 120 Q14 104 14 66 L14 24 Z" fill="rgba(52,183,125,.06)" stroke="var(--ac)" stroke-width="3"/><path d="M60 30 L52 54 L66 62 L54 92" fill="none" stroke="var(--rd)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="eyebrow">Course · Data Protection</div>
      <h1>File Sharing: Links, Folders and Old Access</h1>
      <div class="r-sub">What the sharing settings actually decide, and why access outlasts the reason for it.</div>

    </div>
    <div class="scroll" id="scroll">
      <div class="track" id="track">
        <div class="spine"></div><div class="spine-fill" id="spineFill"></div>
        <!-- nodes injected -->
      </div>
      <div class="scroll-hint" id="hint">scroll<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>
    </div>
  </div>
</div>
<script>
/* ===== SCENE 1 as a vertical timeline with spots ===== */
const NODES=[
 {date:'Start here',crit:0,beat:'Set the sharing on this contract yourself',
  body:'The signed contract has to go to the client’s lawyer. She works at the client, not at your company. She needs to <b>read</b> it, not change it, and only until the deal closes next month.<br><br>Set all three and share it. Everything you need to get it right is in that paragraph.',
  spot:{type:'share',topic:'scope',
    file:'Hartwell-contract-signed.pdf',
    controls:[
     {id:'who',label:'Who can open it',best:2,
      opts:[
       {t:'Anyone with the link',risk:3,
        why:'Not a password — a key. It works for whoever is holding it, and it is forwarded, pasted into chat, and screenshotted without anyone telling you. You will never see the list of who used it.'},
       {t:'Anyone at your company',risk:2,
        why:'She does not work at your company, so this does not reach her at all — and it does reach every one of your colleagues, which was not the intention either.'},
       {t:'Only the people you name',risk:0,
        why:'She signs in as herself. You get a list of who has access, you can see who opened it, and you can remove her when it is done.'}]},
     {id:'what',label:'What they can do',best:0,
      opts:[
       {t:'View only',risk:0,
        why:'What the task asked for. She can read it; the file cannot be altered, and the signed version stays the signed version.'},
       {t:'Can comment',risk:1,
        why:'Reasonable for a draft under negotiation. For a signed contract it is more than was asked, and comments on an executed document confuse the record later.'},
       {t:'Can edit',risk:3,
        why:'On a signed contract this is the one that matters. Edit rights on many services also include the right to re-share it, so you would be handing over the decision you are making right now.'}]},
     {id:'when',label:'How long',best:1,
      opts:[
       {t:'No expiry',risk:2,
        why:'The default nearly everywhere, and the reason old access piles up. Nothing about this file says it should still be reachable next year.'},
       {t:'Until the deal closes',risk:0,
        why:'An expiry does the tidying you were never going to do. If the date slips, extending takes five seconds; if you forget, it closes itself.'},
       {t:'One-time access',risk:1,
        why:'Tighter than needed. Lawyers reread contracts, and she will be back to check a clause — then you are reissuing links, which is where people start using looser settings to save the hassle.'}]}],
    fb:'Named person, view only, with an end date. Not because tighter is always better — because that is what the task actually described, and the task described it in one short paragraph.<br><br>That is the whole method. The sharing settings are not a security ritual; they are a sentence about who needs what, for how long. The trouble starts when nobody writes the sentence and the default answers it instead.'}},

 {date:'2020–2023',crit:1,beat:'A link to one folder that opened the whole account',
  body:'Now the version where somebody got it wrong at scale.<br><br>Microsoft researchers published open-source AI models on GitHub and included a link so people could download them. Reasonable. The link was supposed to point at the folder holding the models.<br><br>It did not. It had been created with access to <b>the entire storage account</b>, and with permission not just to read but to write and delete. Alongside the models sat 38TB of other data: backups of two employees’ machines, containing passwords, keys, and more than 30,000 internal Teams messages.',
  more:{t:'The expiry that was extended to 2051',
    body:'The link was published in July 2020 with an expiry of October 2021 — so it would have closed itself after fifteen months. In October 2021, rather than reissuing it, someone extended the expiry. The new date was <b>October 2051</b>.<br><br>It was found by outside researchers in June 2023 and revoked two days later. Nearly three years, and nothing in between would have surfaced it: a link that works is indistinguishable from a link that works correctly. No alert fires because nothing is going wrong, as far as the system is concerned. Permission is being used exactly as granted.<br><br>Two things to take from it. Scope and permission are decided once, when the link is made, and nobody re-reads them afterwards. And an expiry is the only part of a share that fails <i>safe</i> — which is why extending one to thirty years undoes more than it looks like.'},
  spot:{type:'quiz',topic:'scope',q:'Why did this run for nearly three years without anyone noticing?',
    opts:[
     ['The researchers concealed what they had done',0],
     ['A working link and a too-broad link look the same',1],
     ['Microsoft had no monitoring on that account',0],
     ['The data was encrypted, so alerts did not fire',0]],
    fb:'They look the same. The link resolved, people downloaded the models, everything behaved. Nothing was failing, so nothing was reported.<br><br>This is why over-sharing is not caught the way a break-in is caught. A break-in leaves a failed login and an alert. Over-sharing leaves a successful download by someone who was, technically, allowed.'}},

 {date:'Folders',crit:0,beat:'What a folder decides on your behalf',
  body:'That was a link someone made deliberately. Most over-sharing is quieter than that, and it happens through folders.<br><br>You rarely share a file. You put it somewhere — the team folder, the project drive, the shared space that already existed. Whatever that place is shared with, your file is now shared with, and the decision was made by someone else, possibly years ago, for a different set of people.',
  spot:{type:'predict',topic:'folders',q:'You need to put a file with salary data somewhere the two people reviewing it can reach. What is the move?',
    opts:[
     ['Make a new folder, share it with those two, put the file there',1],
     ['Put it in the team folder and rename it so it is not obvious',0],
     ['Put it in the team folder and tell people not to open it',0]],
    fb:'A new place with the right people on it. It takes about twenty seconds and it is the only option here where the access list matches who should see it.<br><br>The other two are the common ones, and they share a flaw: both leave the file reachable by everyone the folder reaches, and rely on those people choosing not to look. An obscure filename is not an access control — and it fails worst against the person who is searching for exactly that word.'}},

 {date:'Months later',crit:1,beat:'Access outlasts the reason it was granted',
  body:'The last part is time, and it is the one no process covers.<br><br>People change teams, projects end, contractors finish, agencies get replaced. What ends is the reason for the access. The access itself does not end — it has no idea the project is over, and nothing prompts anyone to remove it.<br><br>This is how a folder arrives at a list of forty people that nobody chose. Each addition was correct on the day it was made.',
  spot:{type:'experience',topic:'review',q:'Think of a shared folder you use most. If you opened its access list right now, how many names would surprise you?',
    scale:['None, I know who is on it','One or two','I have genuinely no idea'],
    note:'“I have genuinely no idea” is the honest answer for most shared folders, and it is not carelessness — nothing in the working week ever asks the question.<br><br>Which is why this one is worth doing on a timer rather than on instinct. Once a quarter, open the access list of the two or three places you keep anything sensitive, and read the names. Not an audit — just reading a list. Almost everyone finds at least one person who left, changed role, or was added for something that finished.'}},

 {scene2:1,date:'Your sharing',crit:0,beat:'Three things to do with what you share',
  body:'Mark whichever you mean to do.',
  spot:{type:'checklist',
    items:[
      {topic:'scope',t:'Name people instead of using a link, for anything confidential',
       how:'A named person signs in as themselves, appears on a list, and can be removed. A link is a key that works for whoever ends up holding it.',
       steps:['When you share, choose the option that asks for an email address rather than the one that produces a link','Keep links for things you would not mind a stranger opening','If a link is the only practical option, set an expiry on it'],
       itnote:'Some organisations restrict link sharing centrally. If your options look narrower than this course describes, that is usually why.'},
      {topic:'folders',t:'Check where a sensitive file is going before you put it there',
       how:'The folder decides who can reach your file, and somebody else decided the folder.',
       steps:['Before saving anything sensitive to a shared space, open that space’s sharing settings and read who has access','If the list is wider than the file deserves, make a new folder for it','Watch for “anyone with the link” inherited from the folder — it applies to everything you add'],
       itnote:''},
      {topic:'review',t:'Put one access review in the calendar',
       how:'Access outlasts its reason, and nothing in the working week prompts you to look.',
       steps:['Pick the two or three places where you keep anything sensitive','Set a recurring reminder — quarterly is enough — to open their access lists and read the names','Remove anyone whose reason has ended: left, changed team, finished the project'],
       itnote:'In a managed environment IT may run access reviews already. Worth asking — if they do, yours is a shorter job.'}
    ]}}
];

const scroll=document.getElementById('scroll'),track=document.getElementById('track'),spineFill=document.getElementById('spineFill');
let xp=0;const addXP=n=>{xp+=n;document.getElementById('xp').textContent=xp+' XP';};

// build nodes
NODES.forEach((n,i)=>{
  const el=document.createElement('div');el.className='node'+(n.crit?' crit':'')+(n.scene2?' s2':'');el.dataset.i=i;
  let h=`<div class="dot"></div><div class="date">${n.date}</div><div class="beat">${n.beat}</div><div class="body">${n.body}</div>`;
  if(n.more){
    h+=`<div class="more" id="more-${i}"><button class="more-t" data-more="${i}"><span class="cv"></span>${n.more.t}</button>
      <div class="more-b"><div class="more-in">${n.more.body}</div></div></div>`;
  }
  if(n.spot){
    const s=n.spot;const isExp=s.type==='experience';const isCheck=s.type==='checklist';
    if(isCheck){
      h+=`<div class="spot checklist-spot"><div class="personal" id="personal-${i}"></div><div class="checklist" id="cl-${i}">`;
      s.items.forEach((it,j)=>{
        h+=`<div class="cl-item" data-cl="${i}" data-idx="${j}" data-topic="${it.topic}">
          <div class="cl-row"><div class="cl-box" data-check="${i}-${j}">\u2713</div><div class="cl-t">${it.t}</div><div class="cl-flag">start here</div><button class="cl-toggle" data-how="${i}-${j}">How ▾</button></div>`;
        h+=`<div class="cl-how" id="how-${i}-${j}"><p class="chow">${it.how}</p>`;
        if(it.steps){h+='<ol class="csteps">'+it.steps.map(x=>`<li>${x}</li>`).join('')+'</ol>';}
        if(it.itnote){h+=`<div class="cl-itnote">\u2139\uFE0F ${it.itnote}</div>`;}
        h+=`<button class="cl-done" data-done="${i}-${j}">I\u2019ll do this \u2713</button></div></div>`;
      });
      h+=`</div><div class="cl-gate" id="gate-${i}">Mark whichever you mean to do — they go into your plan below.</div></div>`;
    } else if(s.type==='weigh'){
      h+=`<div class="spot weigh-spot"><div class="wg-q">${s.q}</div><div class="wg-grid">`;
      s.sides.forEach((sd,j)=>{
        h+=`<div class="wg" id="wg-${i}-${j}"><div class="wg-c">
          <div class="wg-h"><span>${sd.ic}</span><b>${sd.t}</b></div>
          <ul class="wg-l">${sd.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>
          <button class="wg-pick" data-weigh="${i}-${j}">${sd.pick}</button>
          <div class="wg-v"></div></div>`;
      });
      h+=`</div><div class="weigh-fb" id="wgfb-${i}"></div></div>`;
    } else if(s.type==='share'){
      h+=`<div class="spot share-spot"><div class="sh-file"><span>\u{1F4C4}</span>${s.file}</div>
        <div class="sh-dlg">`;
      s.controls.forEach((c,ci)=>{
        h+=`<div class="sh-row" id="sh-${i}-${ci}"><div class="sh-lab">${c.label}</div>
          <div class="sh-opts">${c.opts.map((o,oi)=>`<button class="sh-o" data-sh="${i}-${ci}-${oi}">${o.t}</button>`).join('')}</div>
          <div class="sh-why"><div class="sh-wi" id="shw-${i}-${ci}"></div></div></div>`;
      });
      h+=`<button class="sh-go" id="shgo-${i}" data-shgo="${i}" disabled>Share it</button>
        <div class="sh-note" id="shn-${i}">Choose all three first</div></div>
        <div class="myth-fb" id="shfb-${i}"></div></div>`;
    } else if(s.type==='trace'){
      h+=`<div class="spot trace-spot"><div class="tr-file"><span>\u{1F4C4}</span>${s.file}</div>
        <div class="tr-q">${s.q}</div><div class="tr">`;
      s.stops.forEach((st,j)=>{
        h+=`<div class="tr-s l${st.level}" id="tr-${i}-${j}"><div class="tr-dot"></div><div class="tr-c">
          <button class="tr-b" data-trace="${i}-${j}"><span class="tr-ic">${st.ic}</span>
            <span class="tr-t">${st.t}</span><span class="tr-cue">Who?</span></button>
          <div class="tr-w"><div class="tr-wi">
            <div class="tr-rl"><span class="tr-rn">${st.reach}</span><span class="tr-bar"><i></i></span></div>
            <div class="tr-who">${st.who}</div></div></div></div></div>`;
      });
      h+=`</div><div class="tr-bar2"><span id="trp-${i}">0 of ${s.stops.length} opened \u2014 open them all to see the pattern</span>
        <span class="tr-p"><i id="trpb-${i}"></i></span></div>
        <div class="myth-fb" id="trfb-${i}"></div></div>`;
    } else if(s.type==='sort'){
      h+=`<div class="spot sort-spot"><div class="so">`;
      s.items.forEach((it,j)=>{
        h+=`<div class="so-i" id="so-${i}-${j}"><div class="so-t">${it.t}</div>
          <div class="so-btns">${s.buckets.map((bk,k)=>`<button class="so-b" data-sort="${i}-${j}-${k}">${bk}</button>`).join('')}</div>
          <div class="so-v"><span class="so-tag"></span><span class="so-verdict"></span></div>
          <div class="so-w"><div class="so-wi">${it.why}</div></div></div>`;
      });
      h+=`</div><div class="so-bar"><span id="sop-${i}">0 of ${s.items.length} sorted</span><span class="so-prog"><i id="sopb-${i}"></i></span></div>
        <div class="myth-fb" id="sofb-${i}"></div></div>`;
    } else if(s.type==='myths'){
      h+=`<div class="spot myth-spot"><div class="my">`;
      s.items.forEach((it,j)=>{
        h+=`<div class="my-i" id="my-${i}-${j}"><div class="my-t">${it.t}</div>
          <div class="my-btns"><button class="my-b" data-myth="${i}-${j}-1">True</button><button class="my-b" data-myth="${i}-${j}-0">False</button></div>
          <div class="my-v"><span class="my-tag"></span><span class="my-verdict"></span></div>
          <div class="my-w"><div class="my-wi">${it.why}</div></div></div>`;
      });
      h+=`</div><div class="myth-fb" id="myfb-${i}"></div></div>`;
    } else if(s.type==='scan'){
      const total=s.items.filter(x=>x.flag).length;
      h+=`<div class="spot scan-spot"><div class="scan">`;
      s.items.forEach((it,j)=>{
        h+=`<div class="sc-i" id="sc-${i}-${j}"><button class="sc-r" data-scan="${i}-${j}">
          <span class="sc-ic">${it.ic}</span><span class="sc-t">${it.t}</span><span class="sc-m"></span></button>
          <div class="sc-w"><div class="sc-wi">${it.why}</div></div></div>`;
      });
      h+=`</div><div class="scan-bar"><span class="scan-n" id="sn-${i}">Nothing picked yet</span>
        <button class="scan-go" data-scango="${i}">That\u2019s all I can see</button></div>
        <div class="flags-fb" id="ffb-${i}"></div></div>`;
    } else if(s.type==='audit'){
      h+=`<div class="spot audit-spot"><div class="aud-q">${s.q}</div><div class="aud">`;
      s.items.forEach((it,j)=>{
        h+=`<div class="aud-i" id="aud-${i}-${j}"><div class="aud-r" data-aud="${i}-${j}"><span class="aud-b"></span><span class="aud-t">${it.t}</span></div><div class="aud-w">${it.why}</div></div>`;
      });
      h+=`</div><div class="aud-bar"><span class="aud-n" id="an-${i}">0 ticked</span><button class="aud-go" data-audgo="${i}">Done \u2014 show me why these matter</button></div><div class="aud-fb" id="afb-${i}"></div></div>`;
    } else if(s.type==='compare'){
      h+=`<div class="spot compare-spot"><div class="cmp-q">${s.q}</div><div class="mailgrid">`;
      s.mails.forEach((m,j)=>{
        h+=`<div class="mailwrap" data-cmp="${i}" data-j="${j}">
          <div class="mail">
            <div class="mail-hd">
              <div class="mail-row"><span class="ml">From</span><span>${m.from} &lt;${m.addr}&gt;</span></div>
              <div class="mail-row"><span class="ml">Subject</span><span class="mail-subj">${m.subj}</span></div>
            </div>
            <div class="mail-bd">${m.lines.map(l=>`<p>${l}</p>`).join('')}
              <div class="mail-link">${m.link}</div>
              <div class="mail-btn">${m.btn}</div>
            </div>
          </div>
          <button class="mail-pick" data-pick="${i}-${j}">This one\u2019s fake</button>
          <div class="mail-verdict"></div>
        </div>`;
      });
      h+=`</div><div class="cmp-fb" id="cfb-${i}"></div></div>`;
    } else if(s.type==='flags'){
      const total=s.flags.filter(f=>!f.ok).length;
      h+=`<div class="spot flags-spot"><div class="mail">`;
      s.mail.forEach(row=>{
        const inner=row.parts.map(p=>typeof p==='string'?p:`<span class="fseg" data-fseg="${i}-${p[0]}">${p[1]}</span>`).join('');
        if(row.label){h+=`<div class="mail-hd" style="border-bottom:${row.label==='Subject'?'1px solid var(--line)':'none'};padding-bottom:${row.label==='Subject'?'12px':'4px'}"><div class="mail-row"><span class="ml">${row.label}</span><span${row.label==='Subject'?' class="mail-subj"':''}>${inner}</span></div></div>`;}
        else if(row.link){h+=`<div class="mail-bd" style="padding-top:0;padding-bottom:6px"><div class="mail-link">${inner}</div></div>`;}
        else if(row.foot){h+=`<div class="mail-foot">${inner}</div>`;}
        else{h+=`<div class="mail-bd" style="padding-top:6px;padding-bottom:6px"><p style="margin:0">${inner}</p></div>`;}
      });
      h+=`</div><div class="flags-bar"><span class="flags-count" id="fc-${i}">Nothing picked yet</span><button class="flags-show" data-fshow="${i}">That\u2019s all I can see</button></div>
        <div class="flag-one" id="fone-${i}"></div><div class="flags-fb" id="ffb-${i}"></div><div class="flags-rest" id="frest-${i}"></div></div>`;
    } else if(s.type==='takeaways'){
      h+=`<div class="spot takeaways"><div class="tk-list">`;
      s.items.forEach(t=>h+=`<div class="tk"><div class="tk-ic">${t[0]}</div><div><div class="tk-t">${t[1]}</div><div class="tk-b">${t[2]}</div></div></div>`);
      h+=`</div></div>`;
    } else if(s.type==='slider'){
      h+=`<div class="spot slider-spot"><div class="rslider">
        <div class="rslider-q">Drag to set the password length — watch how long it takes to crack.</div>
        <div class="rslider-row"><span class="rslider-label">Length</span>
          <input type="range" class="rslider-input" id="rs-${i}" min="6" max="30" value="10" oninput="updateSlider(${i})">
          <span class="rslider-val" id="rsv-${i}">10</span></div>

           :(ok?'<b class="v-ok">\u2713 That\u2019s right.</b> ':'<b class="v-no">\u2717 Not quite.</b> ');

function updateScan(i,forced){

          ||[...document.querySelectorAll('[id^="sc-'+i+'-"]')].filter(e=>e.classList.contains('bad')&&!e.classList.contains('left')).length;
  const n=document.getElementById('sn-'+i);
  if(n)n.textContent=got?got+' of '+total+' found':'Nothing picked yet';
  if(got===total||forced){
    const fb=document.getElementById('ffb-'+i);
    if(fb&&!fb.classList.contains('show')){fb.innerHTML=s.fb;fb.classList.add('show');
      recordAnswer(s.topic,got>=Math.ceil(total/2));markSeen(i);}
    const btn=document.querySelector('[data-scango="'+i+'"]');if(btn)btn.remove();
  }
}
function updateFlagCount(i,forced){

  const c=document.getElementById('fc-'+i);

    const fb=document.getElementById('ffb-'+i);
    if(fb&&!fb.classList.contains('show')){fb.innerHTML=s.fb;fb.classList.add('show');
      recordAnswer(s.topic,found>=Math.ceil(total/2));markSeen(i);}

  }
}

const TOPIC_LABEL={reach:'What a phone reaches',perms:'App permissions',public:'Charging and public WiFi',lost:'A lost phone'};
function buildPersonal(i){
  const box=document.getElementById('personal-'+i);if(!box||box.dataset.built)return;box.dataset.built=1;
  const weak=[],strong=[];
  Object.keys(topicResults).forEach(t=>{const r=topicResults[t];if(r.wrong>0)weak.push(t);else if(r.right>0)strong.push(t);});
  let h='<div class="p-title">Your personal focus</div>';
  if(weak.length){
    h+='<p class="p-line">You had it mostly down, but a couple of moments tripped you up — so start with these:</p><ul class="p-weak">';
    weak.forEach(t=>h+=`<li>${TOPIC_LABEL[t]||t}</li>`);h+='</ul>';
  }else{
    h+='<p class="p-line">You made the right call every time — nice. Lock it in for real by doing these now:</p>';
  }
  if(strong.length){h+=`<p class="p-strong">You were solid on: ${strong.map(t=>TOPIC_LABEL[t]||t).join(', ')}.</p>`;}
  box.innerHTML=h;
  // flag the checklist items whose topic you got wrong
  document.querySelectorAll('[data-cl="'+i+'"]').forEach(it=>{
    if(weak.includes(it.dataset.topic))it.classList.add('focus');

function checkChecklistDone(i){

    const locked=idx>unlockedUpTo;
    n.classList.toggle('locked',locked);
    n.classList.toggle('seen',!locked);
    // when a checklist node becomes unlocked, build its personalized header
    if(!locked&&NODES[idx].spot&&NODES[idx].spot.type==='checklist')buildPersonal(idx);
    if(!locked&&NODES[idx].spot&&NODES[idx].spot.type==='slider'&&document.getElementById('rs-'+idx)&&!document.getElementById('rs-'+idx).dataset.init){document.getElementById('rs-'+idx).dataset.init=1;updateSlider(idx);}
  });
  if(endEl){const locked=unlockedUpTo<nodesEls.length;endEl.classList.toggle('locked',locked);if(!locked)buildPlan();}
}
function softReveal(el){
  if(!el)return;
  const sr=scroll.getBoundingClientRect(),vh=scroll.clientHeight;
  const rel=el.getBoundingClientRect().top-sr.top;   // node top, relative to the scroll area
  const anchor=vh*0.70;                              // land it low in the view
  if(rel<anchor)return;                              // already comfortably in view — don't jump
  scroll.scrollTo({top:scroll.scrollTop+(rel-anchor),behavior:'smooth'});
}
function unlockNext(fromIdx,quiet){
  if(fromIdx<unlockedUpTo)return;            // already past
  unlockedUpTo=Math.max(unlockedUpTo,fromIdx+1);
  lockState();
  // reveal the next node at the BOTTOM of the view, so the feedback you just
  // read stays on screen instead of being scrolled away above you
  const nxt=nodesEls[unlockedUpTo]||endEl;
  if(nxt&&!quiet)setTimeout(()=>softReveal(nxt),520);
  // if the newly unlocked node has NO spot (pure narrative), chain-unlock the one after it
  const nd=NODES[unlockedUpTo];
  if(nd&&(!nd.spot||nd.spot.type==='takeaways'||nd.spot.type==='checklist'))setTimeout(()=>unlockNext(unlockedUpTo,true),700);
}
function markSeen(i){ unlockNext(+i); }   // answering spot i unlocks i+1

// spine fill follows scroll (visual only)
scroll.addEventListener('scroll',()=>{
  const st=scroll.scrollTop,vh=scroll.clientHeight;
  const mood=Math.min(1,st/Math.max(1,(scroll.scrollHeight-vh)));scroll.style.setProperty('--mood',mood.toFixed(3));
  document.getElementById('hint').classList.toggle('hide',st>60);
  spineFill.style.height=Math.min(track.scrollHeight,(st+vh*0.5))+'px';
});
// initial: only first node readable
lockState();
// if the very first node has no spot, unlock forward
if(NODES[0]&&!NODES[0].spot)unlockNext(0);
function fsT(){const el=document.documentElement;if(!document.fullscreenElement){el.requestFullscreen&&el.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}

(function(){
  const tip=document.createElement('div');tip.id='gloss-tip';document.body.appendChild(tip);
  let cur=null;
  function place(el){
    tip.innerHTML=el.getAttribute('data-def')||'';
    tip.style.left='0px';tip.style.top='0px';
    const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let left=r.left;if(left+tw>window.innerWidth-8)left=window.innerWidth-tw-8;if(left<8)left=8;
    let top=r.top-th-10;if(top<8)top=r.bottom+10;
    tip.style.left=left+'px';tip.style.top=top+'px';tip.classList.add('on');cur=el;
  }
  function hide(){tip.classList.remove('on');cur=null}
  document.addEventListener('mouseover',e=>{const g=e.target.closest('.gloss');if(g&&g!==cur)place(g)});
  document.addEventListener('mouseout',e=>{const g=e.target.closest('.gloss');if(g)hide()});
  document.addEventListener('click',e=>{const g=e.target.closest('.gloss');if(g&&matchMedia('(hover:none)').matches){cur===g?hide():place(g);e.preventDefault();return}if(!g)hide()});
  document.addEventListener('scroll',hide,true);
})();

/* password crack-time model (illustrative): ~26 lowercase+ charset, 1e11 guesses/sec */
function crackTime(len){
  const charset=45; // mixed but memorable
  const combos=Math.pow(charset,len);
  const seconds=combos/1e11; // 100 billion guesses/sec
  return seconds;
}
function fmtTime(sec){
  if(sec<1)return['instant','instant'];
  const yr=31557600;
  if(sec>=yr*1e12)return['trillions of years','centuries'];
  if(sec>=yr*1e9)return['billions of years','centuries'];
  if(sec>=yr*1e6)return['millions of years','centuries'];
  if(sec>=yr*1e3)return['thousands of years','centuries'];
  const u=[['second',1],['minute',60],['hour',3600],['day',86400],['year',yr]];
  let val=sec,name='seconds';
  for(let k=u.length-1;k>=0;k--){if(sec>=u[k][1]){val=sec/u[k][1];name=u[k][0];break;}}
  const r=val<10?val.toFixed(1):Math.round(val).toLocaleString();
  return[r+' '+name+(parseFloat(r)===1?'':'s'),name];
}
window.updateSlider=function(i){
  const len=+document.getElementById('rs-'+i).value;
  document.getElementById('rsv-'+i).textContent=len;
  const marker=document.getElementById('rsm-'+i);marker.style.left=((len-6)/(30-6)*100)+'%';
  const sec=crackTime(len);const[label]=fmtTime(sec);
  const res=document.getElementById('rsr-'+i);
  let lvl,lname,expl;
  if(sec<3600){lvl='lvl-crit';lname='Cracked instantly';expl='Short passwords fall in seconds to minutes. This is where a \u201Ccomplex\u201D short password like Xy7#2! lives.';}
  else if(sec<31557600*10){lvl='lvl-high';lname='Weak';expl='Hours to a few years \u2014 not enough. Tr0pical!2024 sits around here despite looking clever.';}
  else if(sec<31557600*1e6){lvl='lvl-med';lname='Getting strong';expl='Now we\u2019re into many years. Each extra character multiplies the time.';}
  else{lvl='lvl-low';lname='Very strong';expl='Centuries and beyond. This is passphrase territory \u2014 Penguin-Carpet-Thunder-Mango lives here.';}
  res.className='rslider-result '+lvl;
  document.getElementById('rss-'+i).textContent=label;
  document.getElementById('rsl-'+i).textContent=lname;
  document.getElementById('rse-'+i).textContent=expl;
  const eg=document.getElementById('rseg-'+i);
  if(len<=8)eg.innerHTML='At this length even random characters aren\u2019t safe. <b>Length is the lever.</b>';
  else if(len>=24)eg.innerHTML='<b>This is why passphrases win:</b> four random words easily reach this length, and you can actually remember them.';
  else eg.innerHTML='Keep dragging \u2014 notice the jump from years to centuries as you add characters.';
  // first interaction unlocks the next node
  if(!document.getElementById('rs-'+i).dataset.moved){document.getElementById('rs-'+i).dataset.moved=1;addXP(2);unlockNext(+i);}
};
